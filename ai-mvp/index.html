<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Build Your First MVP with AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Syne:wght@700;800&display=swap');
    :root{--ink:#191c18;--paper:#f2efe4;--lime:#c8ff39;--coral:#ff6b4a;--blue:#83b9ff;--muted:#686b62;--line:rgba(25,28,24,.18);--ease:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0f110f;color:var(--ink);font-family:Manrope,Arial,sans-serif}
    button{font:inherit}.deck{height:100%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 25%,#2c3128 0,#111411 55%,#090a09 100%)}

    .slide{position:absolute;inset:0;padding:5.2% 6%;display:grid;grid-template-rows:auto 1fr auto;opacity:0;visibility:hidden;transform:translateX(3%);transition:opacity .35s var(--ease),transform .5s var(--ease);background:var(--paper)}
    .slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:3.2vw 3.2vw;mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 84%,transparent)}
    .slide.dark{background:var(--ink);color:var(--paper)}.slide.lime{background:var(--lime)}.slide.coral{background:var(--coral)}.slide.blue{background:var(--blue)}
    .eyebrow,.footer,.mono{font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.09em}.eyebrow{font-size:clamp(10px,1vw,18px);font-weight:500;display:flex;gap:.8em;align-items:center}.eyebrow::before{content:"";width:2.4em;height:.55em;background:var(--coral)}
    h1,h2{font-family:Syne,Arial,sans-serif;letter-spacing:-.055em;margin:0;line-height:.94}h1{font-size:clamp(42px,7.1vw,126px);max-width:11ch}h2{font-size:clamp(28px,4.25vw,76px);max-width:15ch}.wide h2{max-width:20ch}.accent{color:var(--coral)}.dark .accent{color:var(--lime)}
    .body{position:relative;z-index:1;display:grid;align-items:center;padding-top:2.5%}.split{grid-template-columns:1.08fr .92fr;gap:6%}.copy{font-size:clamp(13px,1.55vw,28px);line-height:1.45;max-width:34em}.copy strong{font-weight:800}.lead{font-size:clamp(18px,2.15vw,39px);line-height:1.28;max-width:31em}.small{font-size:clamp(11px,1.18vw,21px)}
    ul{list-style:none;padding:0;margin:1.2em 0 0}li{position:relative;padding:.34em 0 .34em 1.25em}li::before{content:"■";position:absolute;left:.1em;top:.75em;color:var(--coral);font-size:.45em}.dark li::before{color:var(--lime)}
    .footer{font-size:clamp(8px,.72vw,13px);display:flex;align-items:end;justify-content:space-between;z-index:3}.footer .rule{height:1px;background:currentColor;opacity:.35;flex:1;margin:0 1.2em .45em}.section{opacity:.65}
    .hero-mark{position:absolute;right:-2%;bottom:-13%;font-family:Syne;font-size:34vw;line-height:.8;color:var(--lime);transform:rotate(-9deg);letter-spacing:-.12em}.dark .hero-mark{color:#30362d}.title-sub{font-size:clamp(16px,2vw,36px);line-height:1.35;max-width:28em;margin-top:1.2em}.stamp{display:inline-block;border:2px solid currentColor;padding:.55em .8em;transform:rotate(-2deg);font-family:'DM Mono';text-transform:uppercase;font-size:clamp(10px,1vw,18px);margin-top:1.5em}
    .big-number{font-family:Syne;font-size:clamp(90px,18vw,320px);line-height:.72;color:var(--coral);letter-spacing:-.1em}.dark .big-number{color:var(--lime)}
    .quote{font-family:Syne;font-size:clamp(26px,4vw,72px);line-height:1.08;letter-spacing:-.045em;max-width:17ch}.quote::before{content:'“';color:var(--coral)}.dark .quote::before{color:var(--lime)}
    .diagram{display:grid;gap:1.2vw}.node{border-top:3px solid currentColor;padding:1em 0}.node b{display:block;font-family:Syne;font-size:clamp(18px,2vw,36px);line-height:1}.node span{display:block;margin-top:.5em;font-size:clamp(10px,1vw,18px);line-height:1.35}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5vw;align-items:center}.flow .node{position:relative}
    .matrix{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--ink);border:3px solid var(--ink)}.matrix>div{background:var(--paper);padding:1.2em;min-height:7em}.matrix b{font-family:Syne;font-size:clamp(16px,1.7vw,30px)}.matrix p{font-size:clamp(10px,1vw,18px);margin:.6em 0 0}.matrix .hot{background:var(--coral)}
    .ladder{display:flex;align-items:end;gap:1.2vw;height:62%}.step{flex:1;border-top:4px solid var(--ink);padding:.8em .3em;background:linear-gradient(to top,rgba(25,28,24,.08),transparent);height:var(--h)}.step b{font-family:Syne;font-size:clamp(16px,1.7vw,30px)}.step span{display:block;font-family:'DM Mono';font-size:clamp(8px,.78vw,14px);margin-top:.5em}.dark .step{border-color:var(--paper);background:linear-gradient(to top,rgba(242,239,228,.08),transparent)}
    .prompt{background:var(--ink);color:var(--paper);padding:1.25em 1.4em;font-family:'DM Mono';font-size:clamp(10px,1vw,18px);line-height:1.5;box-shadow:1vw 1vw 0 var(--lime)}.prompt em{color:var(--lime);font-style:normal}.dark .prompt{background:var(--paper);color:var(--ink);box-shadow:1vw 1vw 0 var(--coral)}.dark .prompt em{color:#d94829}
    .timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:.5vw;align-items:stretch}.day{border-top:4px solid var(--ink);padding:.75em .35em;background:rgba(255,255,255,.25)}.day:nth-child(4),.day:nth-child(5){background:var(--lime)}.day b{font-family:Syne;font-size:clamp(16px,1.6vw,29px)}.day span{display:block;margin-top:.7em;font-size:clamp(8px,.86vw,16px);line-height:1.3}.dark .day{border-color:var(--paper);background:rgba(255,255,255,.05)}
    .controls{position:fixed;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #ffffff28;border-radius:99px;background:#111c;backdrop-filter:blur(12px);color:#fff;transition:opacity .2s}.controls button{min-width:34px;height:34px;padding:0 10px;border:0;border-radius:99px;color:inherit;background:#ffffff12;cursor:pointer}.controls button:hover,.controls button:focus-visible{background:var(--lime);color:#111;outline:none}.counter{font-family:'DM Mono';font-size:12px;min-width:58px;text-align:center}.progress{position:fixed;z-index:30;left:0;top:0;height:4px;background:var(--lime);transition:width .35s var(--ease)}
    .overview{position:fixed;inset:0;z-index:40;background:#0b0d0b;display:none;overflow:auto;padding:3vw}.overview.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.thumb{aspect-ratio:16/9;background:var(--paper);color:var(--ink);padding:18px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}.thumb:hover{border-color:var(--lime)}.thumb b{font-family:Syne;font-size:22px;line-height:1}.thumb span{position:absolute;bottom:12px;right:14px;font-family:'DM Mono';font-size:11px}.help{position:fixed;z-index:50;inset:0;display:none;place-items:center;background:#000b}.help.open{display:grid}.help-card{background:var(--paper);padding:32px;max-width:520px;box-shadow:14px 14px 0 var(--lime)}.help-card h3{font-family:Syne;font-size:32px;margin:0 0 12px}.help-card p{line-height:1.7;margin:0}
    .slide.active .reveal{animation:rise .6s var(--ease) both}.slide.active .r2{animation-delay:.12s}.slide.active .r3{animation-delay:.22s}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @media(max-aspect-ratio:4/5){.split{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:repeat(4,1fr)}.slide{padding:7%}.stage{width:100vw;height:100vh}.controls{bottom:8px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    @media print{html,body{height:auto;overflow:visible;background:#fff}.deck{display:block;height:auto}.stage{width:auto;height:auto;box-shadow:none}.slide{position:relative;width:13.333in;height:7.5in;opacity:1;visibility:visible;transform:none;break-after:page}.controls,.progress,.overview,.help{display:none!important}}
  </style>

  <div class="stage" id="stage"></div>
</main>
<div class="progress" id="progress"></div>
<nav class="controls" aria-label="Presentation controls">
  <button id="prev" aria-label="Previous slide">Prev</button><span class="counter" id="counter">01 / 26</span>
  <button id="next" aria-label="Next slide">Next</button><button id="grid" aria-label="Slide overview">▦</button>
  <button id="full" aria-label="Toggle fullscreen">⛶</button><button id="helpBtn" aria-label="Keyboard help">?</button>
</nav>

<div class="help" id="help"><div class="help-card"><h3>Navigate the deck</h3><p><b>Left / Right keys</b> previous or next &nbsp;·&nbsp; <b>Space</b> next<br><b>O</b> overview &nbsp;·&nbsp; <b>F</b> fullscreen &nbsp;·&nbsp; <b>Home / End</b> jump<br><b>Esc</b> close overview or help</p></div></div>
<script>
const slides=[
{theme:'dark',section:'OPEN',title:'Build your first <span class="accent">MVP</span> with AI',html:`<div class="title-sub reveal r2">From idea to real users—faster, leaner, and with less code.</div><div class="stamp reveal r3">A practical field guide</div><div class="hero-mark">AI</div>`},
{section:'MINDSET',title:'The goal isn’t to build more.',html:`<div class="split"><div class="quote reveal">The goal is to learn sooner.</div><div class="copy reveal r2">An MVP is the smallest product that tests an important assumption.<ul><li>Does the problem matter?</li><li>Will people try the solution?</li><li>Will they return or pay?</li></ul></div></div>`},
{theme:'lime',section:'MINDSET',title:'AI compresses the journey to an experiment',html:`<div class="flow reveal"><div class="node"><b>Research</b><span>Summarize markets and conversations</span></div><div class="node"><b>Design</b><span>Turn rough ideas into usable flows</span></div><div class="node"><b>Build</b><span>Write, explain, and debug code</span></div><div class="node"><b>Learn</b><span>Analyze behavior and feedback</span></div></div>`},
{theme:'coral',section:'MINDSET',title:'Faster building can create faster waste',html:`<div class="split"><div class="big-number reveal">0</div><div class="copy reveal r2"><strong>Features do not equal evidence.</strong><ul><li>Don’t start with technology</li><li>Don’t confuse synthetic research with customers</li><li>Don’t accept generated code without testing</li></ul></div></div>`},
{section:'DISCOVER',title:'Begin with a painful problem',html:`<div class="split"><div class="lead reveal">“People need better productivity” is broad.<br><br><strong>“Freelance designers spend hours turning discovery calls into proposals”</strong> is testable.</div><div class="diagram reveal r2"><div class="node"><b>Who?</b><span>Exactly who experiences it?</span></div><div class="node"><b>When?</b><span>Where and how often?</span></div><div class="node"><b>Cost?</b><span>Time, money, risk, or frustration?</span></div></div></div>`},
{theme:'dark',section:'DISCOVER',title:'Turn the idea into a testable hypothesis',html:`<div class="prompt reveal">We believe <em>[specific user]</em> struggles with <em>[specific problem]</em>.<br>If we provide <em>[solution]</em>, they will <em>[measurable behavior]</em>.</div><div class="copy reveal r2" style="margin-top:3%">Example: 5 of 10 freelance designers will use a notes-to-proposal tool for a real client.</div>`},
{section:'DISCOVER',title:'Use AI to accelerate customer discovery',html:`<div class="split"><div class="copy reveal"><strong>Use AI to:</strong><ul><li>Draft unbiased interview questions</li><li>Summarize reviews and transcripts</li><li>Cluster recurring problems</li><li>Compare patterns across participants</li></ul></div><div class="quote reveal r2">AI can analyze customer evidence. It cannot replace it.</div></div>`},
{theme:'blue',section:'DISCOVER',title:'Map your assumptions before you build',html:`<div class="matrix reveal"><div><b>Desirability</b><p>Do people want the outcome?</p></div><div><b>Viability</b><p>Can it create sustainable value?</p></div><div><b>Feasibility</b><p>Can we deliver it reliably?</p></div><div><b>Trust</b><p>Will users share data and rely on it?</p></div></div>`},
{section:'DISCOVER',title:'Test the riskiest assumption first',html:`<div class="split"><div class="matrix reveal"><div><b>Known</b><p>Low uncertainty</p></div><div class="hot"><b>Test now</b><p>High impact + high uncertainty</p></div><div><b>Monitor</b><p>Low impact</p></div><div><b>Build later</b><p>Evidence already exists</p></div></div><div class="lead reveal r2">Before building a financial assistant, test whether users will connect their accounts.</div></div>`},
{theme:'dark',section:'DEFINE',title:'An MVP is the smallest useful learning loop',html:`<div class="flow reveal"><div class="node"><b>Problem</b><span>A meaningful difficulty</span></div><div class="node"><b>Experience</b><span>A simple intervention</span></div><div class="node"><b>Outcome</b><span>A result users value</span></div><div class="node"><b>Evidence</b><span>Behavior that teaches you</span></div></div>`},
{theme:'lime',section:'DEFINE',title:'Choose one user, one problem, one promise',html:`<div class="quote reveal">Turn a freelance designer’s meeting notes into an editable client proposal in under five minutes.</div><div class="copy reveal r2" style="margin-top:2%">One audience. One core workflow. One measurable outcome.</div>`},
{section:'DEFINE',title:'Cut scope aggressively',html:`<div class="ladder reveal"><div class="step" style="--h:100%"><b>Must</b><span>Tests the core promise</span></div><div class="step" style="--h:72%"><b>Later</b><span>Improves a validated product</span></div><div class="step" style="--h:42%"><b>Never—for now</b><span>Impressive, not essential</span></div></div>`},
{theme:'coral',section:'DEFINE',title:'Pick the cheapest useful experiment',html:`<div class="ladder reveal"><div class="step" style="--h:34%"><b>Page</b><span>Test interest</span></div><div class="step" style="--h:45%"><b>Prototype</b><span>Test usability</span></div><div class="step" style="--h:57%"><b>Concierge</b><span>Test the outcome</span></div><div class="step" style="--h:73%"><b>No-code</b><span>Test the workflow</span></div><div class="step" style="--h:95%"><b>Coded MVP</b><span>Test real usage</span></div></div>`},
{section:'DESIGN',title:'Translate the concept into a clear product brief',html:`<div class="flow reveal" style="grid-template-columns:repeat(3,1fr)"><div class="node"><b>User</b><span>Who is it for?</span></div><div class="node"><b>Problem</b><span>What hurts?</span></div><div class="node"><b>Outcome</b><span>What changes?</span></div><div class="node"><b>Workflow</b><span>What must happen?</span></div><div class="node"><b>Metric</b><span>What proves value?</span></div><div class="node"><b>Exclusions</b><span>What is not in v1?</span></div></div>`},
{theme:'dark',section:'DESIGN',title:'Use repeatable prompt patterns',html:`<div class="split"><div class="prompt reveal"><em>ROLE</em> + context<br><em>TASK</em> + constraints<br><em>OUTPUT</em> + acceptance criteria</div><div class="copy reveal r2"><ul><li>Research: find patterns, never invent</li><li>UX: critique friction and trust</li><li>Code: implement one bounded feature</li><li>Test: cover failure and edge cases</li></ul></div></div>`},
{theme:'blue',section:'DESIGN',title:'Treat AI as a collaborator',html:`<div class="flow reveal" style="grid-template-columns:repeat(5,1fr)"><div class="node"><b>Role</b><span>Who should it be?</span></div><div class="node"><b>Context</b><span>What should it know?</span></div><div class="node"><b>Task</b><span>What must it do?</span></div><div class="node"><b>Limits</b><span>What must it avoid?</span></div><div class="node"><b>Criteria</b><span>What does “done” mean?</span></div></div>`},
{section:'DESIGN',title:'Design the journey before the screens',html:`<div class="flow reveal" style="grid-template-columns:repeat(5,1fr)"><div class="node"><b>Entry</b><span>Why now?</span></div><div class="node"><b>Input</b><span>What is needed?</span></div><div class="node"><b>Action</b><span>What happens?</span></div><div class="node"><b>Result</b><span>Where is the value?</span></div><div class="node"><b>Next</b><span>Edit, save, share?</span></div></div><div class="copy reveal r2" style="margin-top:3%"><strong>Example:</strong> Paste notes · choose type · generate · review · export</div>`},
{theme:'lime',section:'DESIGN',title:'Prototype the experience before the infrastructure',html:`<div class="split"><div class="big-number reveal">5</div><div class="copy reveal r2"><strong>Ask five questions:</strong><ul><li>Do users understand it?</li><li>Can they finish unaided?</li><li>Do they trust the result?</li><li>Is the outcome useful?</li><li>What do they expect next?</li></ul></div></div>`},
{section:'BUILD',title:'Choose a build path that fits the experiment',html:`<div class="flow reveal" style="grid-template-columns:repeat(3,1fr)"><div class="node"><b>AI coding</b><span>Flexible, custom, ownable</span></div><div class="node"><b>No-code</b><span>Fast, accessible, constrained</span></div><div class="node"><b>Hybrid</b><span>Visual speed + custom logic</span></div></div><div class="copy reveal r2" style="margin-top:3%">Choose for skill, complexity, integrations, data sensitivity, lifespan, and rebuild cost.</div>`},
{theme:'dark',section:'BUILD',title:'Assemble a practical starter stack',html:`<div class="flow reveal" style="grid-template-columns:repeat(4,1fr)"><div class="node"><b>Think</b><span>Research + synthesis</span></div><div class="node"><b>Shape</b><span>Wireframe + prototype</span></div><div class="node"><b>Ship</b><span>Code + backend + auth</span></div><div class="node"><b>See</b><span>Analytics + feedback</span></div></div><div class="quote reveal r2" style="margin-top:3%">Start simple. Add infrastructure only when the experiment needs it.</div>`},
{theme:'blue',section:'BUILD',title:'Choose AI tools by the job—not the hype',html:`<div class="flow reveal" style="grid-template-columns:repeat(3,1fr)"><div class="node"><b>Think</b><span>ChatGPT · Claude · Perplexity<br>Research, synthesis, product briefs</span></div><div class="node"><b>Design</b><span>Figma AI · Canva<br>Flows, mockups, visual assets</span></div><div class="node"><b>Prototype</b><span>v0 · Lovable · Bolt<br>Turn prompts into working interfaces</span></div><div class="node"><b>Code</b><span>Cursor · GitHub Copilot<br>Implement, explain, test, debug</span></div><div class="node"><b>Backend</b><span>Supabase · Firebase<br>Data, authentication, storage</span></div><div class="node"><b>Learn</b><span>PostHog · Hotjar<br>Behavior, funnels, user feedback</span></div></div><div class="copy small reveal r2" style="margin-top:2%"><strong>Rule:</strong> begin with the problem and workflow. Swap tools as the product’s needs change.</div>`},
{theme:'coral',section:'BUILD',title:'Build one vertical slice at a time',html:`<div class="flow reveal" style="grid-template-columns:repeat(5,1fr)"><div class="node"><b>Paste</b><span>Meeting notes</span></div><div class="node"><b>Send</b><span>To the model</span></div><div class="node"><b>Draft</b><span>Proposal appears</span></div><div class="node"><b>Edit</b><span>User stays in control</span></div><div class="node"><b>Export</b><span>Outcome delivered</span></div></div><div class="lead reveal r2" style="margin-top:3%">One working journey beats ten unfinished features.</div>`},
{section:'BUILD',title:'Follow an AI-assisted build loop',html:`<div class="flow reveal" style="grid-template-columns:repeat(4,1fr)"><div class="node"><b>Specify</b><span>One small outcome</span></div><div class="node"><b>Generate</b><span>Plan, then edit</span></div><div class="node"><b>Inspect</b><span>Run the real product</span></div><div class="node"><b>Save</b><span>Keep the working version</span></div></div><div class="copy reveal r2" style="margin-top:3%">Small changes are easier to understand, test, debug, and reverse.</div>`},
{theme:'blue',section:'BUILD',title:'Keep humans responsible for trust',html:`<div class="split"><div class="copy reveal"><strong>Own the system:</strong><ul><li>Privacy and permissions</li><li>Architecture and business rules</li><li>Accessibility and accuracy</li><li>Cost and usage limits</li></ul></div><div class="quote reveal r2">Plausible output is not the same as correct output.</div></div>`},
{theme:'lime',section:'LAUNCH',title:'Go from idea to launch in seven days',html:`<div class="timeline reveal"><div class="day"><b>01</b><span>Define</span></div><div class="day"><b>02</b><span>Research</span></div><div class="day"><b>03</b><span>Scope + prototype</span></div><div class="day"><b>04</b><span>Build</span></div><div class="day"><b>05</b><span>Build</span></div><div class="day"><b>06</b><span>Test + repair</span></div><div class="day"><b>07</b><span>Launch to 5–10 users</span></div></div><div class="copy reveal r2" style="margin-top:3%">The goal is not a finished company. It is a credible experiment.</div>`},
{theme:'dark',section:'LAUNCH',title:'Launch, measure, and learn',html:`<div class="split"><div class="diagram reveal"><div class="node"><b>Activation</b><span>Reached the first meaningful result?</span></div><div class="node"><b>Time-to-value</b><span>How quickly?</span></div><div class="node"><b>Retention</b><span>Did they return?</span></div></div><div><div class="quote reveal r2">AI accelerates execution. Real users validate the idea.</div><div class="stamp reveal r3">What can you launch this week?</div></div></div>`}
];
const stage=document.getElementById('stage'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),overview=document.getElementById('overview'),help=document.getElementById('help');let current=0;
function shell(s,i){return `<section class="slide ${s.theme||''} ${s.wide?'wide':''}" data-index="${i}" aria-hidden="true"><header class="eyebrow reveal">${s.section} / ${String(i+1).padStart(2,'0')}</header><div class="body"><div><h2 class="reveal">${s.title}</h2><div class="reveal r2" style="margin-top:3%">${s.html}</div></div></div><footer class="footer"><span>AI × MVP</span><span class="rule"></span><span>${String(i+1).padStart(2,'0')}</span></footer></section>`}
stage.innerHTML=slides.map(shell).join('');
overview.innerHTML=slides.map((s,i)=>`<button class="thumb" data-go="${i}"><b>${s.title.replace(/<[^>]+>/g,'')}</b><span>${String(i+1).padStart(2,'0')}</span></button>`).join('');
const els=[...document.querySelectorAll('.slide')];
function show(n){current=Math.max(0,Math.min(slides.length-1,n));els.forEach((el,i)=>{el.classList.toggle('active',i===current);el.setAttribute('aria-hidden',i!==current)});counter.textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;progress.style.width=`${(current+1)/slides.length*100}%`;location.hash=`slide-${current+1}`}
function toggleOverview(force){overview.classList.toggle('open',force??!overview.classList.contains('open'))}
function toggleFull(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('grid').onclick=()=>toggleOverview();document.getElementById('full').onclick=toggleFull;document.getElementById('helpBtn').onclick=()=>help.classList.add('open');
overview.onclick=e=>{const b=e.target.closest('[data-go]');if(b){show(+b.dataset.go);toggleOverview(false)}};help.onclick=()=>help.classList.remove('open');
addEventListener('keydown',e=>{if(e.key==='Escape'){toggleOverview(false);help.classList.remove('open');return}if(overview.classList.contains('open'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='o')toggleOverview();if(e.key.toLowerCase()==='f')toggleFull();if(e.key==='?')help.classList.add('open')});
let touchX=0;stage.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});stage.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>45)show(current+(d<0?1:-1))},{passive:true});
const hash=location.hash.match(/slide-(\d+)/);show(hash?+hash[1]-1:0);
</script>
</body>
